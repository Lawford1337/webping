version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uptime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - uptime_net

  redis:
    image: redis:7-alpine
    container_name: uptime_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - uptime_net

  app:
    image: oven/bun:latest
    container_name: uptime_app
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "3000:3000"
    volumes:
      - ../:/app
      - /app/node_modules
    command: bun run dev
    depends_on:
      - postgres
      - redis
    networks:
      - uptime_net

networks:
  uptime_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
